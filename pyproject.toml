[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fanuc-opcua"
version = "0.3.0"
description = "Read and write FANUC robot I/O, registers and positions over the controller's built-in OPC UA server."
readme = "README.md"
authors = [
    {name = "Nikhil Kumar"}
]
requires-python = ">=3.9"
dependencies = [
    "asyncua>=1.0.5"
]
keywords = ["fanuc", "robot", "opc-ua", "opcua", "roboguide", "industrial-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Manufacturing",
]

[project.urls]
Homepage = "https://github.com/kumar-nikhil/fanuc-opcua-lib"

[project.scripts]
fanuc-opcua = "fanuc_opcua.cli:main"

[project.optional-dependencies]
web = [
    "aiohttp>=3.9"
]
build = [
    "aiohttp>=3.9",
    "pyinstaller>=6.16"
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "aiohttp>=3.9"
]

[tool.setuptools.packages.find]
include = ["fanuc_opcua*"]

[tool.setuptools.package-data]
"fanuc_opcua.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "roboguide: needs a live controller; set FANUC_TEST_HOST (e.g. 127.0.0.2) to run",
]
